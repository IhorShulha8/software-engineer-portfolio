# Netlify build configuration for the Angular 20 portfolio.
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  # Angular's application (esbuild) builder emits static files under
  # dist/<project>/browser/.
  publish = "dist/software-engineer-portfolio/browser"

[build.environment]
  # Angular 20 / @netlify/angular-runtime v4 require Node 22+.
  NODE_VERSION = "22"

# SPA redirects + the `/en` -> `/` canonical redirect live in public/_redirects
# (single source of truth — Netlify merges both _redirects and rules here).
# Do not duplicate them in this file.

# Security headers for every response.
# script-src needs 'unsafe-inline' for Angular's inline event-replay script
# in prerendered HTML; style-src for Angular's inlined critical CSS.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Internal endpoints: keep out of search indexes.
[[headers]]
  for = "/__form.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/index.csr.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Long-cache the hashed bundle assets, never the HTML.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hashed font/media files emitted by the bundler.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
