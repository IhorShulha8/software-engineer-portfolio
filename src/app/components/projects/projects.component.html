<section class="work">
  <header class="work__head">
    <h2>{{ title() }}</h2>
    <p class="work__lead">{{ lead() }}</p>
  </header>

  <div class="work__grid">
    @for (c of cases(); track c.TITLE; let i = $index) {
      <article class="case" appReveal [revealDelay]="i * 0.07">
        <div class="case__top">
          <span class="case__tag">{{ c.TAG }}</span>
          <span class="case__role">{{ c.ROLE }}</span>
        </div>

        <h3 class="case__title">{{ c.TITLE }}</h3>

        <ul class="case__stack">
          @for (tech of c.STACK; track tech) {
            <li>{{ tech }}</li>
          }
        </ul>

        <p class="case__result">{{ c.RESULT }}</p>
      </article>
    }
  </div>
</section>
