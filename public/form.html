<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact Form</title>
</head>
<body>
  <!-- 
    Static twin of the Angular contact form. Netlify detects forms at build 
    time by scanning this HTML; the SPA then POSTs the same field names to 
    /form.html so submissions land in the Netlify Forms inbox.
  -->
  <form name="inquiry" method="post" data-netlify="true" netlify-honeypot="bot-field">
    <input type="text" name="name" />
    <input type="email" name="email" />
    <textarea name="message"></textarea>
    <input name="bot-field" />
    <button type="submit">Send</button>
  </form>
</body>
</html>
