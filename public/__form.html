<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Form Endpoint</title>
</head>
<body>
  <!-- 
    Dedicated endpoint for Netlify Forms.
    By POSTing directly to this physical file path (/__form.html), 
    we bypass the Angular SPA wildcard redirect (/* /index.html 200)
    which is known to cause 404 errors for POST requests on Netlify.
  -->
  <form name="inquiry" method="post" action="/__form.html" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="inquiry" />
    <input type="text" name="name" required minlength="2" maxlength="80" />
    <input type="email" name="email" required maxlength="254" />
    <textarea name="message" required minlength="20" maxlength="2000"></textarea>
    <input name="bot-field" />
    <button type="submit">Send</button>
  </form>
</body>
</html>
